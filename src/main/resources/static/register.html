<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ShopSphere</title>

    <link rel="stylesheet"
          href="/css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        ShopSphere
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/products.html">Products</a>
    </div>

</nav>


<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    minlength="6"
                    required>

            </div>


            <button
                type="submit"
                class="btn">

                Register

            </button>

        </form>


        <p id="message"
           class="message"></p>


        <div class="auth-link">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script>

document.getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        fetch("/api/users", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                role: "USER"
            })

        })

        .then(response => {

            if (!response.ok) {

                return response.json()
                    .then(error => {

                        throw new Error(
                            error.message ||
                            "Registration failed"
                        );

                    });
            }

            return response.json();

        })

        .then(() => {

            document.getElementById("message")
                .textContent =
                "Registration successful!";

            setTimeout(() => {

                window.location.href =
                    "/login.html";

            }, 1000);

        })

        .catch(error => {

            document.getElementById("message")
                .textContent =
                error.message;

        });

    });

</script>

</body>
</html>
