<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - ShopSphere</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        ShopSphere Admin
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/products.html">
            Products
        </a>

        <a href="/orders.html">
            My Orders
        </a>

        <button
            class="btn btn-danger"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="page-container">

    <h1 class="page-title">
        Admin Dashboard
    </h1>


    <!-- ===================================== -->
    <!-- PRODUCT MANAGEMENT -->
    <!-- ===================================== -->

    <div class="admin-section">

        <h2>Product Management</h2>


        <div class="product-form">

            <input
                type="text"
                id="name"
                placeholder="Product Name">


            <input
                type="text"
                id="description"
                placeholder="Description">


            <input
                type="number"
                id="price"
                placeholder="Price">


            <input
                type="number"
                id="quantity"
                placeholder="Quantity">


            <input
                type="text"
                id="category"
                placeholder="Category">

        </div>


        <div class="admin-actions">

            <button
                class="btn"
                onclick="addProduct()">

                Add Product

            </button>


            <button
                class="btn btn-edit"
                onclick="updateProduct()">

                Update Product

            </button>

        </div>


        <p id="message"
           class="message"></p>


        <br>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Description</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Category</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="productTable">
                </tbody>

            </table>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- ALL ORDERS -->
    <!-- ===================================== -->

    <div class="admin-section">

        <h2>All Customer Orders</h2>


        <button
            class="btn"
            onclick="loadAllOrders()">

            View All Orders

        </button>


        <br><br>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Status</th>

                        <th>Total Amount</th>

                        <th>Created At</th>

                    </tr>

                </thead>


                <tbody id="ordersTable">
                </tbody>

            </table>

        </div>


        <p id="ordersMessage"
           class="message"></p>

    </div>


    <!-- ===================================== -->
    <!-- USERS -->
    <!-- ===================================== -->

    <div class="admin-section">

        <h2>Registered Users</h2>


        <button
            class="btn"
            onclick="loadUsers()">

            View All Users

        </button>


        <br><br>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>User ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                    </tr>

                </thead>


                <tbody id="usersTable">
                </tbody>

            </table>

        </div>


        <p id="usersMessage"
           class="message"></p>

    </div>

</div>



<script>

/* =========================================
   LOGIN / ADMIN CHECK
========================================= */

const token =
    localStorage.getItem("token");

const role =
    localStorage.getItem("role");


if (!token) {

    window.location.href =
        "/login.html";

}
else if (role !== "ADMIN") {

    alert("Admin access only");

    window.location.href =
        "/";

}


/* =========================================
   SELECTED PRODUCT
========================================= */

let selectedProductId = null;


/* =========================================
   LOAD PRODUCTS
========================================= */

function loadProducts() {

    fetch("/api/products")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load products"
            );

        }

        return response.json();

    })

    .then(products => {

        const table =
            document.getElementById(
                "productTable"
            );

        table.innerHTML = "";


        products.forEach(product => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>${product.id}</td>

                <td>${product.name}</td>

                <td>${product.description}</td>

                <td>₹${product.price}</td>

                <td>${product.quantity}</td>

                <td>${product.category}</td>

                <td>

                    <button
                        class="btn btn-small btn-edit"
                        onclick="editProduct(${product.id})">

                        Edit

                    </button>


                    <button
                        class="btn btn-small btn-delete"
                        onclick="deleteProduct(${product.id})">

                        Delete

                    </button>

                </td>
            `;


            /*
             Store product information on row.
             editProduct() can use product ID safely.
            */

            row.dataset.product =
                JSON.stringify(product);


            table.appendChild(row);

        });

    })

    .catch(error => {

        document.getElementById(
            "message"
        ).textContent =
            error.message;

    });

}


/* =========================================
   ADD PRODUCT
========================================= */

function addProduct() {

    const name =
        document.getElementById(
            "name"
        ).value;

    const description =
        document.getElementById(
            "description"
        ).value;

    const price =
        document.getElementById(
            "price"
        ).value;

    const quantity =
        document.getElementById(
            "quantity"
        ).value;

    const category =
        document.getElementById(
            "category"
        ).value;


    fetch("/api/products", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/json",

            "Authorization":
                "Bearer " + token

        },

        body: JSON.stringify({

            name: name,

            description: description,

            price: Number(price),

            quantity: Number(quantity),

            category: category

        })

    })

    .then(response => {

        if (!response.ok) {

            return response.json()
                .then(error => {

                    throw new Error(
                        error.message ||
                        "Unable to add product"
                    );

                });

        }

        return response.json();

    })

    .then(() => {

        alert(
            "Product added successfully"
        );

        clearProductForm();

        loadProducts();

    })

    .catch(error => {

        document.getElementById(
            "message"
        ).textContent =
            error.message;

    });

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(productId) {

    const rows =
        document.querySelectorAll(
            "#productTable tr"
        );


    for (const row of rows) {

        const product =
            JSON.parse(
                row.dataset.product
            );


        if (product.id === productId) {

            selectedProductId =
                product.id;


            document.getElementById(
                "name"
            ).value =
                product.name;


            document.getElementById(
                "description"
            ).value =
                product.description;


            document.getElementById(
                "price"
            ).value =
                product.price;


            document.getElementById(
                "quantity"
            ).value =
                product.quantity;


            document.getElementById(
                "category"
            ).value =
                product.category;


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            break;
        }
    }
}


/* =========================================
   UPDATE PRODUCT
========================================= */

function updateProduct() {

    if (selectedProductId === null) {

        alert(
            "Please select a product to edit"
        );

        return;
    }


    const product = {

        name:
            document.getElementById(
                "name"
            ).value,

        description:
            document.getElementById(
                "description"
            ).value,

        price:
            Number(
                document.getElementById(
                    "price"
                ).value
            ),

        quantity:
            Number(
                document.getElementById(
                    "quantity"
                ).value
            ),

        category:
            document.getElementById(
                "category"
            ).value

    };


    fetch(
        `/api/products/${selectedProductId}`,
        {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json",

                "Authorization":
                    "Bearer " + token

            },

            body:
                JSON.stringify(product)

        }
    )

    .then(response => {

        if (!response.ok) {

            return response.json()
                .then(error => {

                    throw new Error(
                        error.message ||
                        "Unable to update product"
                    );

                });

        }

        return response.json();

    })

    .then(() => {

        alert(
            "Product updated successfully"
        );

        selectedProductId = null;

        clearProductForm();

        loadProducts();

    })

    .catch(error => {

        document.getElementById(
            "message"
        ).textContent =
            error.message;

    });

}


/* =========================================
   DELETE PRODUCT
========================================= */

function deleteProduct(productId) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {
        return;
    }


    fetch(
        `/api/products/${productId}`,
        {

            method: "DELETE",

            headers: {

                "Authorization":
                    "Bearer " + token

            }

        }
    )

    .then(response => {

        if (!response.ok) {

            return response.json()
                .then(error => {

                    throw new Error(
                        error.message ||
                        "Unable to delete product"
                    );

                });

        }

        return response.text();

    })

    .then(() => {

        alert(
            "Product deleted successfully"
        );

        loadProducts();

    })

    .catch(error => {

        document.getElementById(
            "message"
        ).textContent =
            error.message;

    });

}


/* =========================================
   CLEAR PRODUCT FORM
========================================= */

function clearProductForm() {

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "description"
    ).value = "";

    document.getElementById(
        "price"
    ).value = "";

    document.getElementById(
        "quantity"
    ).value = "";

    document.getElementById(
        "category"
    ).value = "";

}


/* =========================================
   LOAD ALL ORDERS
========================================= */

function loadAllOrders() {

    fetch("/api/orders", {

        method: "GET",

        headers: {

            "Authorization":
                "Bearer " + token

        }

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load orders"
            );

        }

        return response.json();

    })

    .then(orders => {

        const table =
            document.getElementById(
                "ordersTable"
            );

        table.innerHTML = "";


        if (orders.length === 0) {

            document.getElementById(
                "ordersMessage"
            ).textContent =
                "No orders found";

            return;

        }


        document.getElementById(
            "ordersMessage"
        ).textContent = "";


        orders.forEach(order => {

            const row =
                document.createElement(
                    "tr"
                );


            const values = [

                order.id,

                order.user?.name ??
                    "Unknown",

                order.status,

                "₹" +
                    order.totalAmount,

                order.createdAt ??
                    "-"

            ];


            values.forEach(value => {

                const cell =
                    document.createElement(
                        "td"
                    );

                cell.textContent =
                    value;

                row.appendChild(cell);

            });


            table.appendChild(row);

        });

    })

    .catch(error => {

        document.getElementById(
            "ordersMessage"
        ).textContent =
            error.message;

    });

}


/* =========================================
   LOAD USERS
========================================= */

function loadUsers() {

    fetch("/api/users", {

        method: "GET",

        headers: {

            "Authorization":
                "Bearer " + token

        }

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load users"
            );

        }

        return response.json();

    })

    .then(users => {

        const table =
            document.getElementById(
                "usersTable"
            );

        table.innerHTML = "";


        if (users.length === 0) {

            document.getElementById(
                "usersMessage"
            ).textContent =
                "No users found";

            return;

        }


        document.getElementById(
            "usersMessage"
        ).textContent = "";


        users.forEach(user => {

            const row =
                document.createElement(
                    "tr"
                );


            const values = [

                user.id,

                user.name,

                user.email,

                user.role

            ];


            values.forEach(value => {

                const cell =
                    document.createElement(
                        "td"
                    );

                cell.textContent =
                    value;

                row.appendChild(cell);

            });


            table.appendChild(row);

        });

    })

    .catch(error => {

        document.getElementById(
            "usersMessage"
        ).textContent =
            error.message;

    });

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "userId"
    );

    localStorage.removeItem(
        "role"
    );

    localStorage.removeItem(
        "selectedOrderId"
    );


    window.location.href =
        "/login.html";

}


/* =========================================
   INITIAL LOAD
========================================= */

loadProducts();

</script>


</body>

</html>
