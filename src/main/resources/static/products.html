<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Products - ShopSphere</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        ShopSphere
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/products.html">
            Products
        </a>

        <a href="/cart.html">
            Cart
        </a>

        <a href="/orders.html">
            My Orders
        </a>

    </div>

</nav>


<div class="page-container">

    <h1 class="page-title">
        Products
    </h1>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Category</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="productTable">
            </tbody>

        </table>

    </div>


    <p id="message"
       class="message"></p>

</div>


<script>

function loadProducts() {

    fetch("/api/products")

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Unable to load products"
            );
        }

        return response.json();

    })

    .then(products => {

        const table =
            document.getElementById(
                "productTable"
            );

        table.innerHTML = "";


        products.forEach(product => {

            table.innerHTML += `

                <tr>

                    <td>${product.id}</td>

                    <td>${product.name}</td>

                    <td>
                        ${product.description}
                    </td>

                    <td>
                        ₹${product.price}
                    </td>

                    <td>
                        ${product.quantity}
                    </td>

                    <td>
                        ${product.category}
                    </td>

                    <td>

                        <button
                            class="btn btn-small"
                            onclick="addToCart(${product.id})">

                            Add to Cart

                        </button>

                    </td>

                </tr>
            `;

        });

    })

    .catch(error => {

        document.getElementById("message")
            .textContent =
            error.message;

    });

}


function addToCart(productId) {

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert("Please login first");

        window.location.href =
            "/login.html";

        return;
    }


    const userId =
        localStorage.getItem("userId");

    const quantity = 1;


    fetch(
        `/api/cart/${userId}/add/${productId}/${quantity}`,
        {

            method: "POST",

            headers: {

                "Authorization":
                    "Bearer " + token

            }

        }
    )

    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Unable to add product to cart"
            );
        }

        return response.json();

    })

    .then(() => {

        alert(
            "Product added to cart"
        );

    })

    .catch(error => {

        alert(error.message);

    });

}


loadProducts();

</script>


</body>
</html>
